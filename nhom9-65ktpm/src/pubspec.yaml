name: buddytalk
description: "Ứng dụng Kỷ luật cá nhân cải thiện kỹ năng giao tiếp và vượt rào cản ngôn ngữ (BuddyTalk) - Nhóm 09 - 65KTPM"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Quản lý trạng thái (State Management)
  provider: ^6.1.2

  # Xác thực tài khoản (Firebase Auth)
  firebase_core: ^2.30.0
  firebase_auth: ^4.19.0
  google_sign_in: ^6.2.1

  # CSDL Đám mây & Realtime WebSocket (Supabase)
  supabase_flutter: ^2.5.0

  # CSDL Cục bộ Offline-First (SQLite)
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0

  # Dịch thuật tức thì (Trung - Việt - Anh)
  translator: ^1.0.3+1

  # Giao diện & Tiện ích
  shared_preferences: ^2.2.3
  flutter_local_notifications: ^17.1.2
  intl: ^0.19.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
