# CI cho ChaiLish (Nhóm 11 - 65KTPM)
#
# LƯU Ý: GitHub Actions chỉ chạy workflow nằm ở `.github/workflows/` tại GỐC kho.
# Quy chuẩn học phần chỉ cho commit trong thư mục `nhom11-65ktpm/`, nên file này
# được lưu ở đây. Để kích hoạt trên kho Fork của nhóm, copy file này lên gốc:
#
#   mkdir -p .github/workflows && cp nhom11-65ktpm/.github/workflows/ci.yml .github/workflows/nhom11-ci.yml
#
# (KHÔNG đưa thay đổi ở gốc kho vào Pull Request gửi giảng viên.)
# Chạy các bước tương tự ở máy local: `bash nhom11-65ktpm/scripts/ci.sh`

name: nhom11-ci

on:
  pull_request:
    branches: [nhom/nhom11-65ktpm]
    paths: ["nhom11-65ktpm/**", ".github/workflows/nhom11-ci.yml"]
  push:
    branches: [nhom/nhom11-65ktpm]
    paths: ["nhom11-65ktpm/**", ".github/workflows/nhom11-ci.yml"]
  workflow_dispatch:

concurrency:
  group: nhom11-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + Alembic)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nhom11-65ktpm/src/server
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chailish_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/chailish_ci
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nhom11-65ktpm/src/server/requirements.txt
      - name: Cài thư viện
        run: pip install -r requirements.txt
      - name: Migration lên PostgreSQL 16 và kiểm tra model khớp migration
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: Unit test
        run: pytest -v

  mobile:
    name: Flutter (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nhom11-65ktpm/src/app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.3
          cache: true
      - run: flutter pub get
      - name: Phân tích mã nguồn
        run: flutter analyze --no-fatal-infos
      - name: Unit test & widget test
        run: flutter test

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: nhom11-65ktpm/src/server
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm tra cú pháp docker-compose.yml
        run: docker compose config --quiet
      - name: Build image API và Nginx
        run: docker compose build
      - name: Chạy thử toàn bộ stack và gọi /api/health qua HTTPS
        run: |
          docker compose up -d
          for i in $(seq 1 30); do
            if curl -fsk https://localhost/api/health; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Dọn dẹp
        if: always()
        run: docker compose down -v
