# Ghi đè default.conf có sẵn trong image nginx.
upstream chailish_api {
    server api:8000;
    keepalive 16;
}

# HTTP: chỉ phục vụ xác thực Let's Encrypt và chuyển hướng sang HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # File ghi âm WAV gửi lên API chấm phát âm.
    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    location /api/auth/ {
        limit_req zone=auth_zone burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://chailish_api;
    }

    # Trợ lý AI trả về dạng streaming (Server-Sent Events): tắt buffer để
    # từng đoạn chữ tới app ngay lập tức.
    location /api/ai/ {
        proxy_pass http://chailish_api;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://chailish_api;
        proxy_read_timeout 60s;
    }
}
