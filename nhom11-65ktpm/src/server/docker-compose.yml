services:
  db:
    image: postgres:16-alpine
    container_name: chailish_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: chailish_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: chailish_api
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/chailish_db
      - SECRET_KEY=chailish_docker_secret_key_2026
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data:
